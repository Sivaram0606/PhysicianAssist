# Google Cloud Build Pipeline Configuration
# Automates:
# - Unified Full-Stack App (FastAPI Backend + React Frontend):
#   Dockerizes via multi-stage Dockerfile, pushes to Artifact Registry ('agentic-physicianassist' repo),
#   and deploys a single service to Google Cloud Run (Port 8000)

steps:
  # 1. Build the Unified Docker Image (Backend + Compiled Frontend)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/agentic-physicianassist/agentic-physicianassist-backend:$BUILD_ID',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/agentic-physicianassist/agentic-physicianassist-backend:latest',
      '-f', 'Dockerfile',
      '.'
    ]
    id: 'build-unified-app'

  # 2. Push Image (Build ID Tag) to Artifact Registry ('agentic-physicianassist' repository)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/agentic-physicianassist/agentic-physicianassist-backend:$BUILD_ID']
    id: 'push-unified-commit'

  # 3. Push Image (Latest Tag) to Artifact Registry ('agentic-physicianassist' repository)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/agentic-physicianassist/agentic-physicianassist-backend:latest']
    id: 'push-unified-latest'

  # 4. Deploy Unified Service to Google Cloud Run on Port 8000
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'agentic-physicianassist-backend',
      '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/agentic-physicianassist/agentic-physicianassist-backend:$BUILD_ID',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--service-account', 'anaphor@$PROJECT_ID.iam.gserviceaccount.com',
      '--set-env-vars', 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AGENTIC_PHYSICIANASSIST_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global',
      '--port', '8000',
      '--memory', '2Gi',
      '--cpu', '2'
    ]
    id: 'deploy-unified-app'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/agentic-physicianassist/agentic-physicianassist-backend:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
